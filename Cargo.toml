[workspace]
resolver = "2"
members = [
    "crates/lasius-cli",
    "crates/lasius-core",
    "xtask",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/9aia/lasius"
description = "Workspace gardener — clone, sync, and inspect every repo of a GitHub org under one root"
homepage = "https://9aia.com/lasius"
authors = ["9aia"]
keywords = ["git", "github", "monorepo", "cli", "workspace"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[profile.dist]
inherits = "release"
lto = "thin"

[workspace.dependencies]
lasius = { path = "crates/lasius-cli", version = "0.3.0" }
lasius-core = { path = "crates/lasius-core", version = "0.3.0" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
