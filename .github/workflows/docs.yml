name: docs
on:
  push:
    branches: [docs, main]
  workflow_dispatch:
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      # docs/ is a gitignored worktree locally — in CI we rebuild the same
      # layout: main checkout at lasius/, docs branch checked out inside it
      # at lasius/docs/.
      - uses: actions/checkout@v4
        with:
          ref: main
          path: lasius
      - uses: actions/checkout@v4
        with:
          ref: docs
          path: lasius/docs
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Install deps
        working-directory: lasius/docs
        run: bun i
      - name: Build docs
        working-directory: lasius/docs
        run: bun run docs:build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: lasius/docs/.vitepress/dist
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
