[package]
name = "lasius"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[lints]
workspace = true

# No `[[bin]]` — the `lasius` command ships as the tamias pack in
# `libraries/lasius/` (a generated `bins[]` shim →
# `tamias-driver-lasius cli` → `lasius::run_from`, T-012). This
# crate is the engine lib only; the e2e suite lives in
# `lasius-driver/tests/` and spawns `tamias-driver-lasius run`.

[dependencies]
lasius-core.workspace = true
lasius-forge.workspace = true
lasius-forge-gh.workspace = true
lasius-vcs.workspace = true
lasius-vcs-git.workspace = true
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
