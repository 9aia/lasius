[package]
name = "lasius-driver"
description = "tamias-driver-lasius — pavo driver exposing a lasius workspace's engine ops (no views)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["lasius", "workspace", "pavo", "driver"]
categories = ["development-tools"]

[[bin]]
name = "tamias-driver-lasius"
path = "src/main.rs"

[features]
# Embedded surfaces (pavo-driver-kit's surface layer) — optional,
# acyclic: the driver gains `cli`/`mcp` argv verbs that serve its own
# ops manifest; the standalone tamias-driver-cli/-mcp binaries front
# the same ops without any feature. default = ops driver + `run`
# passthrough only.
default = []
cli = ["pavo-driver-kit/cli"]
mcp = ["pavo-driver-kit/mcp"]

[dependencies]
lasius.workspace = true
clap.workspace = true
serde_json.workspace = true
# The public wire contract — git dep so `cargo install --git` and
# `cargo xtask install` work without a sibling ../pavo checkout
# (path deps break workspace resolution on a fresh clone).
# `version` is the crates.io fallback once pavo-protocol publishes.
pavo-protocol = { git = "https://github.com/9aia/pavo", version = "0.1.0" }
# Driver-authoring kit — the ndjson `serve` loop plus the
# manifest/ViewSpec/QueryBinding/ViewNode builders. Same git source
# as pavo-protocol (they resolve to one rev); `version` is the
# crates.io fallback once it publishes.
pavo-driver-kit = { git = "https://github.com/9aia/pavo", version = "0.1.0" }

[dev-dependencies]
# Conformance gate — `cargo test` runs pavo's wire-contract suite
# against this crate's own `tamias-driver-lasius serve` binary.
# Git dep to match pavo-protocol above (path deps break
# `cargo install --git` / fresh-clone resolution).
pavo-testkit = { git = "https://github.com/9aia/pavo" }

[lints]
workspace = true
